<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Town Look-dev</title>
<style>
  :root { --bar: #1c120c; --bar-line: #3b2819; --bar-text: #e9d4b4; --bar-dim: #a48a6a; --gold: #ffc93c; --teal: #2fe6d0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0e0906; color: var(--bar-text); font: 13px/1.3 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  body.aiming canvas { cursor: none; }
  #stage-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; container-type: size; }
  #stage { position: relative; aspect-ratio: 16 / 9; width: min(100cqw, calc(100cqh * 16 / 9)); overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Everything inside #hud is laid out on a 1920x1080 canvas and scaled to fit, like the TV. */
  #hud { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; }

  #menu { position: absolute; inset: 0; font-family: "Rye", serif; color: #fff4dc; }
  #menu[hidden] { display: none; }
  #logo { position: absolute; left: 36px; top: 10px; width: 660px; }
  #logo svg { display: block; width: 100%; height: auto; overflow: visible; }
  #logo.slam { animation: logoslam .34s cubic-bezier(.2,1.6,.4,1) both; transform-origin: 30% 60%; }
  @keyframes logoslam { from { transform: scale(2.6) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .hint { position: absolute; left: 0; right: 0; bottom: 42px; text-align: center; font: 700 28px/1 "Bitter", serif; color: #fff1d8; text-shadow: 0 2px 6px rgba(20,8,0,.95), 0 0 2px rgba(20,8,0,.9); }
  .hint b { color: var(--teal); font-weight: 700; }

  #reticle { position: absolute; width: 0; height: 0; }
  #reticle svg { position: absolute; left: -58px; top: -58px; width: 116px; height: 116px; overflow: visible; transition: transform .14s; }
  #reticle.on svg { transform: scale(.82); }
  #reticle .spin { transition: transform .22s cubic-bezier(.3,1.5,.5,1); transform-box: view-box; transform-origin: center; }
  #reticle.reload .spin { transition: transform 1s cubic-bezier(.2,.8,.2,1); }
  #reticle .body { fill: rgba(26,14,8,.34); stroke: #fff4d8; stroke-width: 3; }
  #reticle .notch { fill: rgba(26,14,8,.85); stroke: #fff4d8; stroke-width: 2.4; }
  #reticle .hole { fill: rgba(16,8,4,.92); stroke: #fff4d8; stroke-width: 2.6; }
  #reticle .brass { fill: #f4bb3e; transition: fill .1s; }
  #reticle .primer { fill: #a9661e; transition: fill .1s; }
  #reticle .spent .brass { fill: #1a0f08; }
  #reticle .spent .primer { fill: #1a0f08; }
  #reticle .pin { fill: #fff4d8; stroke: #1a0e08; stroke-width: 2.5; transition: fill .12s; }
  #reticle .tick { stroke: #fff4d8; stroke-width: 4; stroke-linecap: round; transition: stroke .12s; }
  #reticle.on .pin { fill: #ff5a2a; }
  #reticle.on .tick { stroke: var(--teal); }
  #reticle.on .body { stroke: var(--teal); }
  #reticle.on .notch, #reticle.on .hole { stroke: var(--teal); }
  #banner { position: absolute; left: 0; right: 0; top: 390px; text-align: center; font: 400 92px/1.1 "Rye", serif; color: #ffcd3f; text-shadow: 0 5px 0 #8c3a18, 0 10px 0 #4c1c0e, 0 16px 28px rgba(20,8,0,.7); opacity: 0; }
  #banner.show { animation: stamp .24s cubic-bezier(.2,1.5,.5,1) both; }
  @keyframes stamp { from { opacity: 0; transform: scale(1.7) rotate(-3deg); } to { opacity: 1; transform: scale(1) rotate(-2deg); } }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 68% 76%, rgba(255,220,150,.55), rgba(255,160,70,.12) 42%, rgba(255,160,70,0) 70%); opacity: 0; }
  #flash.go { animation: flash .13s ease-out both; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

  #compare-labels { position: absolute; inset: 0; font: 700 26px/1 "Bitter", serif; color: #fff; }
  #compare-labels[hidden] { display: none; }
  #compare-labels span { position: absolute; padding: 8px 14px; background: rgba(20,10,4,.72); border-radius: 4px; }

  #board { position: absolute; right: 16px; top: 16px; bottom: 16px; width: min(560px, 62%); padding: 16px 18px; overflow: auto; background: rgba(24,14,8,.94); border: 1px solid var(--bar-line); border-radius: 8px; }
  #board[hidden] { display: none; }
  #board h2 { margin: 0 0 12px; font-size: 16px; color: #fff; }
  #board h3 { margin: 16px 0 8px; font-size: 13px; color: var(--bar-text); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tiles figure { margin: 0; }
  .tiles canvas { width: 100%; height: auto; border-radius: 4px; }
  .tiles figcaption { margin-top: 4px; font-size: 12px; }
  .tiles figcaption b { display: block; color: #fff; font-weight: 600; }
  .tiles figcaption span { color: var(--bar-dim); }
  .pair { display: flex; align-items: center; margin-bottom: 8px; }
  .pair i { width: 44px; height: 32px; }
  .pair i:first-child { border-radius: 4px 0 0 4px; }
  .pair i:nth-child(2) { border-radius: 0 4px 4px 0; margin-right: 12px; }
  .pair span { font-size: 12px; color: var(--bar-dim); }
  .pair b { display: block; color: var(--bar-text); font-weight: 600; font-variant-numeric: tabular-nums; }

  #bar { flex: none; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 14px; background: var(--bar); border-top: 1px solid var(--bar-line); }
  #look { min-width: 0; flex: 1 1 260px; }
  #look-name { font-weight: 700; color: #fff; font-size: 14px; }
  #look-tag { color: var(--bar-dim); font-size: 12px; }
  .group { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  .group::before { content: attr(data-label); color: var(--bar-dim); font-size: 11px; margin-right: 4px; }
  #bar button { appearance: none; border: 1px solid var(--bar-line); background: #2a1b11; color: var(--bar-text); padding: 4px 9px; border-radius: 5px; font: inherit; font-size: 12px; cursor: pointer; }
  #bar button:hover { background: #3a2617; }
  #bar button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  #bar button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #2a1608; font-weight: 600; }
  #stats { color: var(--bar-dim); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 150px; text-align: right; }
</style>
</head>
<body>
  <div id="stage-wrap">
    <div id="stage">
      <canvas id="c" width="1920" height="1080"></canvas>
      <div id="hud">
        <div id="menu">
          <h1 id="logo" style="margin:0"></h1>
          <div class="hint"><b>Aim</b> with the arrows &nbsp;·&nbsp; <b>Shoot</b> with Select</div>
          <div id="reticle"><i></i><b></b></div>
          <div id="flash"></div>
          <div id="banner"></div>
        </div>
        <div id="compare-labels" hidden>
          <span style="left:20px;top:20px">1 Dust Haze</span>
          <span style="left:980px;top:20px">2 Golden Standoff</span>
          <span style="left:20px;top:560px">3 Toybox Noon</span>
          <span id="cmp-gray" style="left:980px;top:560px"></span>
        </div>
      </div>
      <div id="board" hidden></div>
    </div>
  </div>
  <div id="bar">
    <div id="look"><div id="look-name"></div><div id="look-tag"></div></div>
    <div class="group" id="dirs" data-label="Look"></div>
    <div class="group" id="mats" data-label="Material"></div>
    <div class="group" id="cams" data-label="View"></div>
    <div class="group" id="clips" data-label="Monkey"></div>
    <div class="group" id="toggles" data-label="Check"></div>
    <div id="stats"></div>
  </div>
  <script>
    (function () {
      var stage = document.getElementById("stage");
      var hud = document.getElementById("hud");
      function fit() { hud.style.transform = "scale(" + stage.clientWidth / 1920 + ")"; }
      new ResizeObserver(fit).observe(stage);
      fit();
    })();
  </script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
